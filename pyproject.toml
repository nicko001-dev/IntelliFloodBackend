[project]
name = "intelliflood-backend"
version = "1.0.0"
description = "Backend FastAPI du système d'alerte précoce d'inondation IntelliFlood"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # B008 : Depends() est l idiome FastAPI ; E501 : textes français longs

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741", "E402", "F403", "F405", "I001"]
